name: ForgeKit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run hard verification
        run: npm run verify

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript type check (no emit)
        run: npx tsc --noEmit

  e2e-contract:
    name: E2E contract (inspect → plan → build)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run E2E pipeline tests
        run: npm test -- tests/e2e/full-pipeline.test.ts

  docker-smoke:
    name: Docker build smoke (real daemon)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run one-command inspect → plan → preflight → build → runtime proof
        run: |
          node dist/cli/index.js deliver ./tests/fixtures/sample-python-project \
            --image forgekit-demo --tag smoke --port 8080 --health-path /health \
            > cli-delivery-result.json
          node -e "const r=require('./cli-delivery-result.json'); if(r.status!=='success'||!r.evidence?.container_started||!r.evidence?.healthcheck_passed) process.exit(1)"
          test -f tests/fixtures/sample-python-project/release-manifest.json
