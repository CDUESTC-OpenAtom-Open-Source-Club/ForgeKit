name: Growth evidence monitor

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: growth-evidence-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Collect privacy-preserving funnel evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-growth-metrics.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- docs/validation/metrics; then
            echo 'No metrics change'
            exit 0
          fi
          git config user.name 'forgekit-growth-monitor[bot]'
          git config user.email 'forgekit-growth-monitor[bot]@users.noreply.github.com'
          git add docs/validation/metrics
          git commit -m 'chore(metrics): update growth evidence snapshot'
          git push
