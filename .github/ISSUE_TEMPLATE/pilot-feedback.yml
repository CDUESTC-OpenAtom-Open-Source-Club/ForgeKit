name: 试点反馈
description: 按真实项目记录一次 ForgeKit 安装、检查或构建体验
title: "试点反馈："
labels: [pilot, feedback]
body:
  - type: markdown
    attributes:
      value: |
        感谢参与试点。请只提交公开且已脱敏的信息，不要粘贴密钥、Token、私有源码或生产日志。
  - type: input
    id: project_type
    attributes:
      label: 项目类型
      description: 例如 Python Flask、TypeScript API、Go 服务
      placeholder: Python Flask
    validations:
      required: true
  - type: input
    id: install_minutes
    attributes:
      label: 从开始到成功接入用了多少分钟
      placeholder: 8
    validations:
      required: true
  - type: input
    id: baseline_minutes
    attributes:
      label: 按原有方式定位或交付通常需要多少分钟
      placeholder: 45
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js、Docker 版本
      placeholder: Ubuntu 24.04 / Node 20 / Docker 28
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: 结果
      options:
        - 成功构建并运行
        - 构建成功但运行失败
        - 在 preflight 阶段失败
        - 构建失败
        - 尚未完成安装
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写出你执行的命令或 Agent 操作，以及关键输出
      placeholder: |
        1. npm ci
        2. npm run verify
        3. 在 MCP 客户端调用 inspect_project ...
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: 已完成的可核验结果
      options:
        - label: 镜像已经成功启动
        - label: HTTP 健康检查已经通过
        - label: Release Manifest 已生成
        - label: 这是首次试用后 7 天内的第二次真实使用
  - type: checkboxes
    id: consent
    attributes:
      label: 公开与隐私确认
      options:
        - label: 我知道内容会公开，并确认未提交密钥、私有源码、生产日志或私人联系方式
          required: true
  - type: textarea
    id: feedback
    attributes:
      label: 对初学者的反馈
      description: 哪一步最容易理解？哪一步需要更清楚？
    validations:
      required: true
